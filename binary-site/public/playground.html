<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Playground · Binary Site</title><link rel="stylesheet" href="/style.css">
</head><body><main>
<nav><a class="back" href="/">← Início</a></nav>
<h1>🎮 Playground</h1>

<div class="panel">
  <h3>1. Seu ID (SID)</h3>
  <div class="row">
    <input id="sid" placeholder="ex.: meu_id_123" autocomplete="off">
    <button id="register">Registrar</button>
  </div>
  <label>Deixe em branco ao registrar para gerar um ID aleatório (mais seguro). Quem souber seu ID pode ler e escrever nos seus bytes.</label>
</div>

<div class="panel">
  <h3>2. Seu byte</h3>
  <div class="row"><label for="idx">Índice (0–255):</label><input id="idx" type="number" min="0" max="255" value="0" style="width:90px"></div>
  <div class="bits" id="bits"></div>
  <p>Valor: <code id="val">00000000</code></p>
  <div class="row">
    <button id="read">Ler</button>
    <button id="write">Escrever</button>
    <button class="ghost" id="all">Ler todos</button>
  </div>
</div>

<div class="panel"><h3>Resposta</h3><pre id="log">Nada ainda. Registre um ID para começar.</pre></div>

<script>
const $ = s => document.querySelector(s);
let bits = Array(8).fill(0);

function renderBits() {
  const el = $('#bits'); el.innerHTML = '';
  bits.forEach((b, i) => {
    const btn = document.createElement('button');
    btn.className = 'bit' + (b ? ' on' : ''); btn.textContent = b;
    btn.onclick = () => { bits[i] ^= 1; renderBits(); };
    el.append(btn);
  });
  $('#val').textContent = bits.join('');
}
function setBits(str) { bits = str.split('').map(Number); renderBits(); }

async function call(method, url, body, useSid = true) {
  const headers = { 'Content-Type': 'application/json' };
  if (useSid) headers.SID = $('#sid').value.trim();
  try {
    const r = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json();
    $('#log').textContent = `${method} ${url}  →  ${r.status}\n` + JSON.stringify(j, null, 2);
    return { ok: r.ok, data: j };
  } catch (e) {
    $('#log').textContent = 'Erro de rede: ' + e.message;
    return { ok: false };
  }
}
const path = () => '/data/binary/' + (parseInt($('#idx').value) || 0);

$('#register').onclick = async () => {
  const sid = $('#sid').value.trim();
  const { ok, data } = await call('POST', '/data/binary/register', sid ? { sid } : {}, false);
  if (ok) { $('#sid').value = data.sid; localStorage.setItem('sid', data.sid); setBits(data.value); }
};
$('#read').onclick = async () => { const { ok, data } = await call('GET', path()); if (ok) setBits(data.value); };
$('#write').onclick = () => call('POST', path(), { value: bits.join('') });
$('#all').onclick = () => call('GET', '/data/binary/all');

$('#sid').value = localStorage.getItem('sid') || '';
renderBits();
</script>
</main></body></html>
