<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My SIDs · Binary Site</title><link rel="stylesheet" href="/style.css">
<script src="/i18n.js"></script>
</head><body data-title="title.account"><main>
<nav><a class="back" href="/" data-i18n="nav.home">← Home</a></nav>
<h1 data-i18n="ac.h1">👤 My SIDs</h1>
<p class="sub" data-i18n="ac.sub">Create an account to see and manage all the SIDs you created.</p>

<section id="guest" class="panel hidden">
  <h3 data-i18n="ac.guest.h">Log in or create an account</h3>
  <div class="row">
    <input id="user" data-i18n-ph="ac.user.ph" placeholder="Username" autocomplete="username" maxlength="24">
    <input id="pass" type="password" data-i18n-ph="ac.pass.ph" placeholder="Password (min. 8)" autocomplete="current-password" maxlength="128">
  </div>
  <div class="row">
    <button id="login" data-i18n="ac.login">Log in</button>
    <button id="signup" class="ghost" data-i18n="ac.signup">Create account</button>
  </div>
  <p id="authMsg" class="msg"></p>
  <label data-i18n="ac.guest.help"></label>
</section>

<section id="app" class="hidden">
  <div class="row" style="justify-content:space-between">
    <h2 style="margin:0" id="hi"></h2>
    <button id="logout" class="ghost small" data-i18n="ac.logout">Log out</button>
  </div>

  <div class="panel">
    <h3 data-i18n="ac.create.h">Create a SID</h3>
    <div class="row">
      <input id="newSid" data-i18n-ph="ac.newsid.ph" placeholder="Choose your own" autocomplete="off" maxlength="32">
      <button id="create" data-i18n="ac.create">Create</button>
    </div>
    <div class="row">
      <button id="suggest" class="ghost" data-i18n="ac.suggest">🎲 Suggest a random one</button>
      <span id="suggestBox" class="hidden">
        <code id="suggested"></code>
        <button id="useIt" class="small" data-i18n="ac.useit">Use this one</button>
        <button id="another" class="ghost small" data-i18n="ac.another">Another</button>
      </span>
    </div>
    <p id="createMsg" class="msg"></p>
    <label data-i18n="ac.create.help"></label>
  </div>

  <div class="panel">
    <h3><span data-i18n="ac.list.h">Your SIDs</span> <span id="count" class="tag"></span></h3>
    <div class="scroll"><table id="table">
      <thead><tr><th data-i18n="ac.th.sid">SID</th><th data-i18n="ac.th.created">Created</th><th data-i18n="ac.th.last">Last used</th><th data-i18n="ac.th.exp">Expires in</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <p id="empty" class="hidden" data-i18n="ac.empty">No SIDs yet. Create one above.</p>
    <label id="listHelp" data-i18n="ac.list.help" data-n="3"></label>
  </div>
</section>

<script>
const $ = s => document.querySelector(s);
let offset = 0, suggestion = null, ttlDays = 3;

async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  let data = {}; try { data = await r.json(); } catch (_) {}
  return { ok: r.ok, status: r.status, data };
}
function msg(el, text, ok) { el.textContent = text; el.className = 'msg ' + (ok ? 'ok' : 'err'); }
const now = () => Date.now() + offset;
function ago(ms) {
  const s = Math.max(0, Math.floor((now() - ms) / 1000));
  if (s < 60) return t('ago.now');
  if (s < 3600) return t('ago.min', { n: Math.floor(s / 60) });
  if (s < 86400) return t('ago.h', { n: Math.floor(s / 3600) });
  return t('ago.d', { n: Math.floor(s / 86400) });
}
function left(ms) {
  const d = ms - now();
  if (d <= 0) return t('left.expired');
  const h = Math.floor(d / 3600000);
  if (h >= 24) return t('left.dh', { d: Math.floor(h / 24), h: h % 24 });
  if (h >= 1) return t('left.h', { h });
  return t('left.min', { m: Math.max(1, Math.floor(d / 60000)) });
}

async function load() {
  const r = await api('GET', '/account/me');
  $('#guest').classList.toggle('hidden', r.ok);
  $('#app').classList.toggle('hidden', !r.ok);
  if (!r.ok) return;
  const d = r.data;
  offset = d.now - Date.now();
  ttlDays = d.ttlDays;
  $('#hi').textContent = t('ac.hi', { name: d.username });
  $('#listHelp').textContent = t('ac.list.help', { n: ttlDays });
  $('#count').textContent = d.sids.length + ' / ' + d.maxSids;
  $('#empty').classList.toggle('hidden', d.sids.length > 0);
  $('#table').classList.toggle('hidden', d.sids.length === 0);
  const rows = $('#rows'); rows.innerHTML = '';
  for (const s of d.sids) {
    const tr = document.createElement('tr');
    const cells = [s.sid, ago(s.created), ago(s.lastUsed), left(s.expiresAt)];
    cells.forEach((text, i) => {
      const td = document.createElement('td');
      if (i === 0) { const c = document.createElement('code'); c.textContent = text; td.append(c); } else td.textContent = text;
      tr.append(td);
    });
    const td = document.createElement('td');
    const copy = document.createElement('button'); copy.className = 'ghost small'; copy.textContent = t('ac.copy');
    copy.onclick = async () => { await navigator.clipboard.writeText(s.sid); copy.textContent = t('ac.copied'); setTimeout(() => copy.textContent = t('ac.copy'), 1200); };
    const del = document.createElement('button'); del.className = 'danger small'; del.textContent = t('ac.delete'); del.style.marginLeft = '6px';
    del.onclick = async () => {
      if (!confirm(t('ac.confirm', { sid: s.sid }))) return;
      const x = await api('DELETE', '/account/sids/' + encodeURIComponent(s.sid));
      if (!x.ok) msg($('#createMsg'), apiError(x.data), false);
      load();
    };
    td.append(copy, del); tr.append(td); rows.append(tr);
  }
}

async function auth(kind) {
  const r = await api('POST', '/account/' + kind, { username: $('#user').value.trim(), password: $('#pass').value });
  if (!r.ok) return msg($('#authMsg'), apiError(r.data), false);
  $('#pass').value = ''; msg($('#authMsg'), '', true); load();
}
$('#login').onclick = () => auth('login');
$('#signup').onclick = () => auth('signup');
$('#pass').addEventListener('keydown', e => { if (e.key === 'Enter') auth('login'); });
$('#logout').onclick = async () => { await api('POST', '/account/logout'); load(); };

async function createSid(sid) {
  const r = await api('POST', '/account/sids', sid ? { sid } : {});
  if (!r.ok) return msg($('#createMsg'), apiError(r.data), false);
  msg($('#createMsg'), t('ac.created', { sid: r.data.sid }), true);
  $('#newSid').value = ''; $('#suggestBox').classList.add('hidden'); suggestion = null; load();
}
$('#create').onclick = () => createSid($('#newSid').value.trim());

async function suggest() {
  const r = await api('GET', '/data/binary/generate');
  if (!r.ok) return msg($('#createMsg'), apiError(r.data), false);
  suggestion = r.data.sid; $('#suggested').textContent = suggestion; $('#suggestBox').classList.remove('hidden');
}
$('#suggest').onclick = suggest;
$('#another').onclick = suggest;
$('#useIt').onclick = () => createSid(suggestion);

document.addEventListener('langchange', () => { $('#createMsg').textContent = ''; $('#authMsg').textContent = ''; load(); });
load();
</script>
</main></body></html>
